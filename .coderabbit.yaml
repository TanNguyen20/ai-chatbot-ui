# Place this in the root of your repo
language: "en-US"
early_access: false 
reviews:
  profile: "chill"             # Options: "chill", "assertive"
  request_changes_workflow: false 
  high_level_summary: true 
  poem: true                   # Fun setting: adds a poem to the summary
  review_status: true 
  collapse_walkthrough: false 
  auto_review:
    enabled: true
    drafts: false              # Set to true to review draft PRs
chat:
  auto_reply: true
